; Configuración de referencia inferida del monitor mostrado en las evidencias.
; La placa exacta y los GPIO reales deben verificarse antes de flashear.
[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = espidf
monitor_speed = 115200
build_type = debug
; En caso de diferencias entre placa y esta selección, AJUSTAR antes de conectar.
